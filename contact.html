<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Humsafar Wedding by GNK</title>
  <meta name="description" content="Begin a conversation with Humsafar Wedding by GNK — email, Instagram, WhatsApp, or the form below.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="icon" href="images/hw-logo.png">
</head>
<body data-page="contact" data-nav="solid">

  <section class="page-hero container">
    <div class="folio" data-reveal>Folio six.</div>
    <div class="eyebrow" data-reveal style="--rd:80ms; margin-top:10px">Write to us</div>
    <h1 class="display display--xl" data-reveal style="--rd:150ms; margin:28px 0 0">
      Begin a<br><em>conversation</em>.
    </h1>
  </section>

  <!-- Channels -->
  <section class="section section--paper section--tight" style="padding-top:0">
    <div class="container">
      <div class="contact-grid" style="margin-top:0">
        <div data-reveal><div class="contact-item__label">Letters</div><a class="contact-item__value" href="mailto:hello@humsafargnk.com">hello@humsafargnk.com</a></div>
        <div data-reveal style="--rd:100ms"><div class="contact-item__label">Instagram</div><a class="contact-item__value" href="https://instagram.com/humsafar.gnk">@humsafar.gnk</a></div>
        <div data-reveal style="--rd:200ms"><div class="contact-item__label">WhatsApp</div><a class="contact-item__value" href="https://wa.me/919811004422">+91 98 1100 4422</a></div>
        <div data-reveal style="--rd:300ms"><div class="contact-item__label">Studio</div><div class="contact-item__value">Hauz Khas, New Delhi</div></div>
      </div>
    </div>
  </section>

  <!-- Form -->
  <section class="section section--cream">
    <div class="container split split--5-7" style="align-items:start">
      <div>
        <div class="eyebrow" data-reveal>The form</div>
        <h2 class="display display--md" data-reveal style="--rd:150ms; margin-top:22px">Tell us<br>your <em>day</em>.</h2>
        <p class="lede" data-reveal style="--rd:300ms; margin-top:28px; max-width:300px">
          A few lines is plenty. We reply within two days — always a person, never a form letter.
        </p>
      </div>

      <form class="form" data-contact-form data-reveal style="--rd:200ms" novalidate>
        <div class="split split--1-1" style="gap:28px">
          <div class="field">
            <label for="name">Your names</label>
            <input id="name" name="name" type="text" placeholder="Aanya &amp; Ranveer" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
          </div>
        </div>
        <div class="split split--1-1" style="gap:28px">
          <div class="field">
            <label for="date">Wedding date (or season)</label>
            <input id="date" name="date" type="text" placeholder="February 2026 / undecided">
          </div>
          <div class="field">
            <label for="service">What you need</label>
            <select id="service" name="service">
              <option>The whole ceremony</option>
              <option>Wedding planning</option>
              <option>Decoration</option>
              <option>Entertainment</option>
              <option>Not sure yet</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="message">Tell us about it</label>
          <textarea id="message" name="message" placeholder="The families, the city, the one image you keep coming back to…"></textarea>
        </div>
        <button class="btn" type="submit">Send your note</button>
        <p class="form__note" data-form-note style="display:none"></p>
      </form>
    </div>
  </section>

  <script src="js/main.js?v=6"></script>
</body>
</html>
