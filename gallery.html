<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Humsafar Wedding by GNK</title>
  <meta name="description" content="Our wedding album — photographs that hold the colour, the music and every blessing, from mehndi to the final phera.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
  <link rel="icon" href="images/hw-logo.png">
</head>
<body data-page="gallery" data-nav="solid">

  <section class="page-hero container">
    <div class="folio" data-reveal style="color:var(--green)">Our wedding album, <span class="gold">moment by moment</span>.</div>
    <h1 class="display display--lg" data-reveal style="--rd:150ms; margin-top:24px">
      Photographs that hold the<br><em style="color:var(--green)">colour</em>, the music,<br>and every blessing.
    </h1>
    <p class="lede page-hero__lede" data-reveal style="--rd:300ms">
      From the mehndi's first laugh to the last phera under the stars — moments from our celebrations, kept the way you'd keep a family heirloom.
    </p>
  </section>

  <!-- Band 1 -->
  <section class="section section--paper section--tight">
    <div class="container mosaic">
      <div data-reveal data-reveal-rot style="--rrot:-1.2deg; grid-column:1 / span 4; grid-row:1 / span 2">
        <figure class="frame" style="--h:560px"><img src="images/gallery/ADA00534.jpg" alt="Humsafar wedding — portrait"></figure>
      </div>
      <div data-reveal style="--rd:120ms; grid-column:5 / span 5; grid-row:1">
        <figure class="frame" style="--h:360px"><img src="images/gallery/ADA00594.JPG" alt="Humsafar wedding — ceremony"></figure>
      </div>
      <div data-reveal data-reveal-rot style="--rd:200ms; --rrot:1.8deg; grid-column:10 / span 3; grid-row:1">
        <figure class="frame" style="--h:360px"><img src="images/gallery/ADA00795.jpg" alt="Humsafar wedding — detail"></figure>
      </div>
      <div data-reveal style="--rd:280ms; grid-column:5 / span 3; grid-row:2">
        <figure class="frame" style="--h:340px"><img src="images/gallery/ADA00833.jpg" alt="Humsafar wedding — candid"></figure>
      </div>
      <div data-reveal style="--rd:360ms; grid-column:8 / span 5; grid-row:2">
        <figure class="frame" style="--h:340px"><img src="images/gallery/ADA00872.jpg" alt="Humsafar wedding — wide"></figure>
      </div>
    </div>
  </section>

  <!-- Band 2 -->
  <section class="section section--cream section--tight">
    <div class="container mosaic">
      <div data-reveal style="grid-column:1 / span 5; grid-row:1">
        <figure class="frame" style="--h:380px"><img src="images/gallery/ADA01195.jpg" alt="Humsafar wedding — moment"></figure>
      </div>
      <div data-reveal data-reveal-rot style="--rd:120ms; --rrot:1.4deg; grid-column:6 / span 3; grid-row:1 / span 2">
        <figure class="frame" style="--h:560px"><img src="images/gallery/ADA01244.jpg" alt="Humsafar wedding — portrait"></figure>
      </div>
      <div data-reveal style="--rd:200ms; grid-column:9 / span 4; grid-row:1">
        <figure class="frame" style="--h:380px"><img src="images/gallery/ADA01326.jpg" alt="Humsafar wedding — celebration"></figure>
      </div>
      <div data-reveal data-reveal-rot style="--rd:280ms; --rrot:-1deg; grid-column:1 / span 5; grid-row:2">
        <figure class="frame" style="--h:340px"><img src="images/gallery/ADA01423.jpg" alt="Humsafar wedding — ritual"></figure>
      </div>
      <div data-reveal style="--rd:360ms; grid-column:9 / span 4; grid-row:2">
        <figure class="frame" style="--h:340px"><img src="images/gallery/ADA01444.jpg" alt="Humsafar wedding — detail"></figure>
      </div>
    </div>
  </section>

  <!-- Band 3 — closing triptych -->
  <section class="section section--paper section--tight">
    <div class="container mosaic">
      <div data-reveal data-reveal-rot style="--rrot:-1deg; grid-column:1 / span 4; grid-row:1">
        <figure class="frame" style="--h:460px"><img src="images/gallery/ADA09379.jpg" alt="Humsafar wedding — portrait"></figure>
      </div>
      <div data-reveal style="--rd:140ms; grid-column:5 / span 4; grid-row:1">
        <figure class="frame" style="--h:460px"><img src="images/gallery/ADA09815.jpg" alt="Humsafar wedding — moment"></figure>
      </div>
      <div data-reveal data-reveal-rot style="--rd:280ms; --rrot:1.2deg; grid-column:9 / span 4; grid-row:1">
        <figure class="frame" style="--h:460px"><img src="images/gallery/ADA09831.jpg" alt="Humsafar wedding — candid"></figure>
      </div>
    </div>
  </section>

  <section class="section section--cream section--tight">
    <div class="container">
      <h2 class="display display--md" data-reveal style="margin-bottom:40px">Your wedding,<br>kept like <em>this</em>.</h2>
      <a class="btn" href="contact.html" data-reveal style="--rd:200ms">Begin a conversation</a>
    </div>
  </section>

  <script src="js/main.js?v=6"></script>
</body>
</html>
